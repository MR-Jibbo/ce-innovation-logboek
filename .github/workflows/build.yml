name: Build & Release

# Runs on every push of a version tag (e.g. v1.0.0, v1.0.1, ...).
# Builds a macOS .dmg and a Windows .exe installer and attaches both
# to a GitHub Release for that tag.
on:
  push:
    tags:
      - "v*.*.*"
  # Allows a manual run from the Actions tab (no release is published then,
  # only the installers are uploaded as build artifacts you can download).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
            artifact-glob: "dist/*.dmg"
          - os: windows-latest
            dist-script: dist:win
            artifact-glob: "dist/*.exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build installer (${{ matrix.os }})
        run: npm run ${{ matrix.dist-script }}
        env:
          # electron-builder auto-detects GITHUB_TOKEN for publishing, but we
          # publish manually below via softprops/action-gh-release instead, so
          # explicitly opt it out of publishing on its own.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # electron-builder's default dmg naming only marks the arm64 (Apple
      # Silicon) build with a "-arm64" suffix and leaves the x64 (Intel)
      # build unlabeled. Relabel both explicitly so a non-technical
      # downloader on the Releases page can immediately tell which of the
      # two Mac files matches their Mac, without needing to know what
      # "x64"/"arm64" means.
      - name: Rename Mac installers for clarity
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          for f in *-arm64.dmg; do
            [ -e "$f" ] || continue
            mv "$f" "${f%-arm64.dmg} (Apple Silicon).dmg"
          done
          for f in *.dmg; do
            [ -e "$f" ] || continue
            case "$f" in
              *"(Apple Silicon)"*) continue ;;
            esac
            mv "$f" "${f%.dmg} (Intel).dmg"
          done
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Three installers per release (Mac Intel, Mac Apple Silicon, Windows)
      # plus the short install guide PDF. No zip/script bundles — the guide
      # covers the (one-line) manual step needed on Mac.
      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/installer-macos-latest/*.dmg
            artifacts/installer-windows-latest/*.exe
            installer/LEES DIT VOOR INSTALLEREN.pdf
            installer/Onepager.pdf
          generate_release_notes: true
