<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy is set from the main process instead of a meta
      tag here (see main/index.ts). A meta-tag CSP with 'self' behaves
      unreliably once the app is loaded via a file:// URL (packaged build),
      which can silently block the app's own scripts/styles and result in a
      blank window — setting the header on the response instead works the
      same in dev (http://) and in the packaged app (file://).
    -->
    <title>CE-Innovation Logboek</title>
    <script>
      // Applies the saved theme preference (Licht/Donker/Systeem, see
      // renderer/lib/theme.ts) synchronously, before first paint, so there's
      // no flash of the wrong theme. Falls back to the OS preference if
      // nothing was chosen yet, or if localStorage is unavailable here.
      (function () {
        try {
          var pref = localStorage.getItem("theme-preference") || "system";
          var isDark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("dark");
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./renderer/main/index.tsx"></script>
  </body>
</html>
